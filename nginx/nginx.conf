events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging format displaying upstream response time and chosen node
    log_format cloud_lb '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        'Upstream: "$upstream_addr" RespTime: $upstream_response_time s';

    access_log /var/log/nginx/access.log cloud_lb;
    error_log  /var/log/nginx/error.log warn;

    # Upstream pool of 3 compute nodes (Virtualisation & Load Balancing)
    upstream backend_cluster {
        # Round-robin algorithm with fast failover on container crash
        server app-node-1:5000 max_fails=2 fail_timeout=3s;
        server app-node-2:5000 max_fails=2 fail_timeout=3s;
        server app-node-3:5000 max_fails=2 fail_timeout=3s;
    }

    server {
        listen 80;
        server_name localhost;

        # Add custom headers to demonstrate load balancing transparency
        add_header X-Handled-By $upstream_addr always;
        add_header X-Cloud-Architecture "High-Availability-CaaS" always;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next upstream on error or timeout
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        # Nginx basic status for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }
    }
}
