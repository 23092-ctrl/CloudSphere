global:
  scrape_interval: 3s
  evaluation_interval: 3s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cloud-apps'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app-node-1:5000', 'app-node-2:5000', 'app-node-3:5000']
